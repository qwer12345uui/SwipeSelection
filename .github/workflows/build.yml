name: Build (iOS 15 RootHide)

on:
  push:
    paths:
      - "RootHide/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Toolchain note: the newest Xcode (26.x, default on current images)
    # emits arm64e ObjC metadata that iOS 15.0's libobjc cannot load —
    # every injected process crashed at load time (pointer authentication
    # failure reading the dylib's __DATA) = Safe Mode / instant app crash.
    # So: use macos-15 (macos-13 is retired) and explicitly select the
    # OLDEST Xcode on the image (16.x era, proven for iOS 15 tweaks).
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select oldest available Xcode (iOS 15-compatible toolchain)
        run: |
          set -e
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -Ev 'Xcode_(26|27)' | head -n 1)
          if [ -z "$XCODE" ]; then XCODE="/Applications/Xcode.app"; fi
          echo "Selected Xcode: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun clang --version

      - name: Install build tools
        run: brew install ldid dpkg

      - name: Install RootHide Theos + patched SDK
        run: |
          set -e
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -L -o /tmp/iPhoneOS16.5.sdk.tar.xz https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz
          tar -xf /tmp/iPhoneOS16.5.sdk.tar.xz -C "$HOME/theos/sdks"
          ls -l "$HOME/theos/sdks"

      - name: Build deb
        working-directory: RootHide
        run: |
          set -o pipefail
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          make clean
          make package FINALPACKAGE=1 2>&1 | tee build.log
          ls -l packages/
          shasum -a 256 packages/*.deb

      - name: Upload deb artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: com.icraze.swipeselection_2.6_roothide
          path: RootHide/packages/*.deb

      - name: Remove broken old releases
        if: success()
        run: |
          gh release delete roothide-2.1 --yes || true
          gh release delete roothide-2.2 --yes || true
          gh release delete roothide-2.3 --yes || true
          git push origin :refs/tags/roothide-2.1 || true
          git push origin :refs/tags/roothide-2.2 || true
          git push origin :refs/tags/roothide-2.3 || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish deb to Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: roothide-2.6
          name: SwipeSelection 2.6 (RootHide, arm64e)
          body: "iOS 15.0+ RootHide 隐根越狱构建产物（基于 iCraze 维护版源码；旧版 Xcode 工具链 + iPhoneOS16.5 SDK 编译）。2.6 修复：点击 123 键无法切换数字键盘——关闭 pan 识别器的 delaysTouchesBegan/Ended（控制键在 touchesEnded 才触发，此前被识别器扣住），并在触摸起点落在控制键上时不启动滑动手势。提交: ${{ github.sha }} / 运行: #${{ github.run_number }}"
          files: RootHide/packages/*.deb

      - name: Publish build log on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p build-logs
          cp RootHide/build.log "build-logs/run-${{ github.run_number }}.log" 2>/dev/null || echo "build.log missing (failure before build step)" > "build-logs/run-${{ github.run_number }}.log"
          git add build-logs/
          git commit -m "[ci] build log for run ${{ github.run_number }}"
          git push origin HEAD:${{ github.ref_name }}
