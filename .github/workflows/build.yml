name: Build (iOS 15 RootHide)

on:
  push:
    paths:
      - "RootHide/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned to macos-13 on purpose: its Xcode-era toolchain emits arm64e
    # binaries that iOS 15.0's libobjc can load. macos-latest (Xcode 26)
    # produces dylibs that crash every injected process at load time
    # (pointer authentication failure in libobjc reading __DATA).
    # Same combination as the Dopamine2-roothide project's own CI.
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ldid dpkg

      - name: Install RootHide Theos + patched SDK
        run: |
          set -e
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -L -o /tmp/iPhoneOS16.5.sdk.tar.xz https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz
          tar -xf /tmp/iPhoneOS16.5.sdk.tar.xz -C "$HOME/theos/sdks"
          ls -l "$HOME/theos/sdks"

      - name: Build deb
        working-directory: RootHide
        run: |
          set -o pipefail
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          make clean
          make package FINALPACKAGE=1 2>&1 | tee build.log
          ls -l packages/
          shasum -a 256 packages/*.deb

      - name: Upload deb artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: com.icraze.swipeselection_2.4_roothide
          path: RootHide/packages/*.deb

      - name: Remove broken old releases
        if: success()
        run: |
          gh release delete roothide-2.1 --yes || true
          gh release delete roothide-2.2 --yes || true
          gh release delete roothide-2.3 --yes || true
          git push origin :refs/tags/roothide-2.1 || true
          git push origin :refs/tags/roothide-2.2 || true
          git push origin :refs/tags/roothide-2.3 || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish deb to Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: roothide-2.4
          name: SwipeSelection 2.4 (RootHide, arm64e)
          body: "iOS 15.0+ RootHide 隐根越狱构建产物（基于 iCraze 维护版源码；macos-13 + iPhoneOS16.5 SDK 旧工具链编译，修复 2.1-2.3 注入即崩/安全模式问题）。提交: ${{ github.sha }} / 运行: #${{ github.run_number }}"
          files: RootHide/packages/*.deb

      - name: Publish build log on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p build-logs
          cp RootHide/build.log "build-logs/run-${{ github.run_number }}.log" 2>/dev/null || echo "build.log missing (failure before build step)" > "build-logs/run-${{ github.run_number }}.log"
          git add build-logs/
          git commit -m "[ci] build log for run ${{ github.run_number }}"
          git push origin HEAD:${{ github.ref_name }}
